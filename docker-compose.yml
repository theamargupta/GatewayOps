services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gatewayops
      POSTGRES_USER: gatewayops
      POSTGRES_PASSWORD: gatewayops_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatewayops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://gatewayops:gatewayops_secret@postgres:5432/gatewayops
      REDIS_URL: redis://redis:6379
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: super_secret_jwt_key_change_in_prod
      RUN_MIGRATIONS: "false"
      RUN_SEEDS: "false"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # node:20-alpine ships BusyBox wget, not curl
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health | grep -q ok || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
